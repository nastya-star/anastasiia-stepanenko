<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV · Anastasiia Stepanenko</title>
<meta name="description" content="CV of Anastasiia Stepanenko, MSc student in Mathematics in Data Science at the Technical University of Munich.">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23111'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Georgia,serif' font-size='15' fill='%23F5F3EE'%3EAS%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#111111;--fg:#F5F3EE;--mute:#B9B5AC;--line:rgba(245,243,238,.75);--hover:rgba(245,243,238,.08);--press:rgba(245,243,238,.16);--ok:#9fd8a8;--err:#ffb4a8;--serif:Georgia,"Times New Roman",Times,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:30rem;margin:0 auto;padding:3.5rem 1.25rem 4rem}
h1{margin:0 0 .4rem;font:400 clamp(2rem,7vw,2.5rem)/1.1 var(--serif)}
.sub{margin:0 0 2rem;color:var(--mute)}

.stack{display:grid;gap:.75rem}
.btn{display:flex;align-items:center;gap:.9rem;width:100%;min-height:3.5rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-weight:600;text-align:left;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--hover);border-color:var(--fg)}
.btn:active{background:var(--press)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.btn svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn .end{width:15px;height:15px;margin-left:auto;opacity:.75;transition:transform .15s}
.btn:disabled{opacity:.6;cursor:progress}

/* "Send CV to my email" disclosure; works without JavaScript */
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .end{transform:rotate(180deg)}
.panel{margin-top:.75rem;padding:1rem;border:1px solid rgba(245,243,238,.3);border-radius:6px}
.panel label{display:block;font-weight:600;margin-bottom:.4rem}
.panel .hint{margin:0 0 .75rem;color:var(--mute);font-size:.88rem}
input[type=email]{width:100%;min-height:3rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:6px;background:#0b0b0b;color:var(--fg);font:inherit}
input[type=email]:focus{outline:2px solid var(--fg);outline-offset:2px}
input[aria-invalid=true]{border-color:var(--err)}
.panel .btn{margin-top:.75rem;justify-content:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.form-status{margin:.75rem 0 0;font-size:.92rem}
.form-status.ok{color:var(--ok)}
.form-status.err{color:var(--err)}

.viewer{display:block;width:100%;height:85vh;min-height:32rem;margin-top:2.5rem;border:1px solid rgba(245,243,238,.25);border-radius:6px;background:#1b1b1b}
.fallback{padding:2rem 1.25rem;color:var(--mute)}
.fallback a{color:var(--fg)}
@media(min-width:64rem){main{max-width:56rem}.stack{max-width:30rem}}
</style>
</head>
<body>
<main>
<h1>CV</h1>
<p class="sub">Anastasiia Stepanenko · Optimization &amp; Data Science · Munich</p>

<div class="stack">
<a class="btn" href="Anastasiia_Stepanenko_CV.pdf" target="_blank" rel="noopener">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Open PDF
<svg class="end" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>

<a class="btn" href="Anastasiia_Stepanenko_CV.pdf" download="Anastasiia_Stepanenko_CV.pdf">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>Download CV
<svg class="end" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>

<details>
<summary class="btn">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l7 2.5L12.5 20z"/><path d="m10 13.5 4-4"/></svg>Send CV to my email
<svg class="end" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
<!-- action = the CV mailer's Apps Script /exec URL (apps-script/cv-mailer/SETUP.md) -->
<form id="cv-request" class="panel" method="post" action="REPLACE_WITH_APPS_SCRIPT_EXEC_URL" novalidate>
<label for="cv-email">Your email address</label>
<p class="hint" id="cv-hint">I’ll send my CV as a PDF from anastasiia.stepanenko.work@gmail.com. Your address is used only for this one email.</p>
<input id="cv-email" name="email" type="email" inputmode="email" autocomplete="email" required maxlength="254" placeholder="name@company.com" aria-describedby="cv-hint cv-status">
<div class="hp" aria-hidden="true"><label for="cv-company">Company</label><input id="cv-company" name="company" type="text" tabindex="-1" autocomplete="off"></div>
<button class="btn" type="submit">Send CV</button>
<p id="cv-status" class="form-status" role="status" aria-live="polite"></p>
</form>
</details>

<a class="btn" href="./">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back</a>
</div>

<object class="viewer" data="Anastasiia_Stepanenko_CV.pdf#view=FitH" type="application/pdf" aria-label="CV of Anastasiia Stepanenko (PDF)">
<p class="fallback">This browser can’t display the PDF here. Use <a href="Anastasiia_Stepanenko_CV.pdf" target="_blank" rel="noopener">Open PDF</a> or <a href="Anastasiia_Stepanenko_CV.pdf" download="Anastasiia_Stepanenko_CV.pdf">Download CV</a>.</p>
</object>
</main>
<script src="cv-request.js" defer></script>
</body>
</html>
