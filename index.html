<style>
:root{--bg:#000;--fg:#fff;--mute:#a3a3a3;--line:rgba(255,255,255,.82);--hover:rgba(255,255,255,.08);--press:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:400 18px/1.35 "EB Garamond",Garamond,"Times New Roman",serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{width:100%;max-width:27rem;padding:3.5rem 1rem}

/* Card header, after the engraved-stationery look: small caps, wide tracking, hairline rule */
header{text-align:center;margin-bottom:2.75rem}
h1{margin:0;font-weight:400;font-size:clamp(2rem,8.5vw,2.6rem);line-height:1.1;font-variant:small-caps;letter-spacing:.09em}
.rule{width:3.5rem;height:1px;margin:1.1rem auto;background:var(--fg);opacity:.7}
.place{margin:0;font-size:.92rem;letter-spacing:.42em;text-transform:uppercase;padding-left:.42em;color:var(--fg)}

nav ul{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.btn{display:flex;align-items:center;gap:1rem;width:100%;min-height:3.75rem;padding:.7rem 1.1rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-decoration:none;transition:background-color .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--hover);border-color:#fff}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn:active{background:var(--press);transform:translateY(1px)}
.btn svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:500;font-size:1.1rem;letter-spacing:.02em}
.txt small{display:block;color:var(--mute);font-size:.95rem;overflow-wrap:anywhere}
.btn .arrow{width:16px;height:16px;stroke-width:1.5;opacity:.8;transition:transform .15s,opacity .15s}
.btn:hover .arrow,.btn:focus-visible .arrow{transform:translate(2px,-2px);opacity:1}

/* Not yet published: same box, visibly inactive */
.btn.soon{border-style:dashed;border-color:rgba(255,255,255,.45);color:var(--mute);cursor:default}
.btn.soon:hover,.btn.soon:active{background:var(--bg);transform:none}
.btn.soon .txt b{color:var(--fg);opacity:.75}
.btn.soon .txt small{letter-spacing:.12em;text-transform:uppercase;font-size:.8rem}
.btn.soon .arrow{visibility:hidden}

@media(prefers-reduced-motion:reduce){.btn,.btn .arrow{transition:none}.btn:active{transform:none}}
</style>

<script>

// published the button stays a "Coming soon" placeholder; once the page

  var url="https://nastya-star.github.io/munich-fuel-min/";
  fetch(url,{method:"HEAD",cache:"no-store"}).then(function(r){
    if(!r.ok)return;
